name: CI

# Run the full quality gate on every push and every pull request.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Runs before the main suite, and separately from it, for two reasons.
      #
      # A broken migration is the most expensive thing to find late — it is the
      # only failure here that can take the live database with it — so it gets
      # the earliest signal it can have.
      #
      # And a red step called "SQL" says something different from a red step
      # called "Test": one means the schema moved, the other means a component
      # did. `npm run test:coverage` below runs these again as part of the whole
      # suite, which costs about 25 seconds and is worth it for a failure you can
      # read without opening the log.
      - name: SQL (migrations replay, brand isolation, billing invariants)
        run: npm run test:sql

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
