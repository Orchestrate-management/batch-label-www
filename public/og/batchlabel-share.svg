<!--
  Source artwork for batchlabel-share.png, the 1200x630 Open Graph card.
  See public/brand/README.md for how to re-render it. The headline is the home page h1
  and the sub-line is the hero body, so if either changes on the site, change it here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Batchlabel. Correct CLP labels for your candles, in minutes.">
  <defs>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.6" fill="#1E1B18" fill-opacity="0.055"></circle>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F3EEE6"></rect>
  <rect width="1200" height="630" fill="url(#grain)"></rect>

  <!-- The punched swing tag from the brand pack, at 1.125x. -->
  <g transform="translate(84 64) scale(1.125)">
    <rect x="6" y="6" width="52" height="52" rx="13" fill="#14514F"></rect>
    <circle cx="20" cy="20" r="4.5" fill="#FBF8F3"></circle>
    <rect x="16" y="34" width="32" height="4.5" rx="2.25" fill="#FBF8F3"></rect>
    <rect x="16" y="44" width="20" height="4.5" rx="2.25" fill="#B4674A"></rect>
  </g>
  <text x="180" y="124" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.2" fill="#14514F">Batchlabel</text>

  <text x="84" y="288" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="600" letter-spacing="-1.6" fill="#1E1B18">Correct CLP labels for your</text>
  <text x="84" y="366" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="600" letter-spacing="-1.6" fill="#1E1B18">candles, in minutes.</text>

  <rect x="84" y="408" width="96" height="6" rx="3" fill="#B4674A"></rect>

  <text x="84" y="470" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4A443D">Upload the safety data sheet from your fragrance supplier,</text>
  <text x="84" y="510" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4A443D">then download a print ready label.</text>

  <rect x="0" y="600" width="1200" height="30" fill="#14514F"></rect>
  <text x="84" y="621" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.4" fill="#F3EEE6">Candles, wax melts, reed diffusers and room sprays &#183; UK and EU CLP</text>
</svg>
